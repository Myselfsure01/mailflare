# nginx shim that makes Cloudflare Workers AI look like a normal
# OpenAI-compatible endpoint for the Mailflare AI assistant settings page.
#
# Why: the Workers AI OpenAI-compat endpoint answers GET /v1/models with
# 405 (no catalog exists upstream), which breaks the app's model picker.
# This vhost serves a static model catalog at = /v1/models and proxies
# /v1/* to the account's Workers AI endpoint, forwarding the caller's
# Authorization header (a scoped Workers AI token lives in the app config).
#
# Replace <CLOUDFLARE_ACCOUNT_ID>, the hostname and the cert paths.
server {
    listen 443 ssl;
    server_name ai.example.com;
    ssl_certificate /etc/nginx/ssl/example.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/example.com/server.key;

    location = /v1/models {
        default_type application/json;
        return 200 '{"object": "list", "data": [{"id": "@cf/qwen/qwen3-30b-a3b-fp8", "object": "model", "name": "Qwen3 30B"}, {"id": "@cf/meta/llama-3.3-70b-instruct-fp8-fast", "object": "model", "name": "Llama 3.3 70B"}]}';
    }

    location /v1/ {
        proxy_pass https://api.cloudflare.com/client/v4/accounts/<CLOUDFLARE_ACCOUNT_ID>/ai/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.cloudflare.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_http_version 1.1;
    }

    location / { return 404; }
}
